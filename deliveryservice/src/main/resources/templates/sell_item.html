<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8"/>
    <title>Sell Item</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

    <script>
        $(document).ready(
            function () {
                //SUBMIT FORM
                $("#itemForm").submit(function(event) {
                    event.preventDefault();
                    ajaxPost();
                    setTimeout(ajaxGet, 600);
                });

                function ajaxPost() {
                    var formData = {
                        storeName: $("#storeName").val(),
                        itemName: $("#itemName").val(),
                        itemWeight: $("#itemWeight").val()
                    };

                    $.ajax({
                        type : "POST",
                        contentType : "application/json",
                        url : "add_item",
                        data : JSON.stringify(formData),
                        dataType : "json",
                    });
                }

                function ajaxGet() {
                    $.ajax({
                        type : "GET",
                        url : "/error_msg",
                        success : function(result) {
                            $('#error').html(result);
                            console.log("MESSAGE SHOWS");
                        }
                    });
                }
            }
        )
    </script>
</head>
<body>
<nav class="navbar navbar-light bg-light">
    <a ckass="navbar-brand" href ="/admin_platform" >Main Menu</a>
    <a href="/logout"><input class="btn btn-outline-success mr-auto" type="button" name="logout" id="logout" value="Logout"></a>
</nav>
<div sec:authorize="isAuthenticated()">
    Authenticated as <span sec:authentication="name"></span>
</div>
<div id="main_container" align="center">
    <div class="stores-wrapper">
        <div class="subtitle">
            Add Store Item
        </div>
        <br>
        <div id="sell_item">
            <form id="itemForm" action="#" method="post">
                <div class="form-group">
                    <label for="storeName">Store Name:</label>
                    <input type="text" class="form-control" id="storeName" name="storeName" required/>
                </div>
                <div class="form-group">
                    <label for="itemName">Item Name:</label>
                    <input type="text" class="form-control" id="itemName" name="itemName" required/>
                </div>
                <div class="form-group">
                    <label for="itemWeight">Item Weight:</label>
                    <input type="number" class="form-control" id="itemWeight" name="itemWeight" placeholder="integer" min="1" required/>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
            <br />
            <div class="buttons button-1 ">
                <a href="/display_items" class="btn btn-primary mr-auto"> Display Items </a>
            </div>
            <div id="error" align="center"></div>
        </div>
    </div>
</div>
</body>
</html>
