<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head th:fragment="html_head">
    <meta charset="UTF-8">
    <title>Display Drones</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

    <script>
        $(document).ready(
            function () {
                //SUBMIT FORM
                $("#displayDronesForm").submit(function (event) {
                    event.preventDefault();
                    ajaxGetDrone();
                    setTimeout(ajaxGet, 600);
                });

                function ajaxGetDrone() {
                    var formData = {
                        storeName: $("#storeName").val()
                    };

                    $.ajax({
                        type: "GET",
                        contentType : "application/json",
                        url: "list_drones",
                        data : formData,
                        success: function (result) {
                            $('#emp').empty();
                            if (result.status == "success") {
                                var list = "";
                                $.each(result.data, function (i, drone) {
                                    list += '<tr>';
                                    list += '<td>' + drone.droneID + '</td>'
                                    list += '<td>' + drone.weightCap + '</td>'
                                    list += '<td>' + drone.numOrders + '</td>'
                                    list += '<td>' + drone.remainingCap + '</td>'
                                    list += '<td>' + drone.remainingDelivery + '</td>'
                                    list += '<td>' + drone.pilotID + '</td>'
                                    list += '</tr>';
                                });
                                $('#drone-list').append(list);
                                console.log("Success: ", result);
                            }
                        },
                        error: function (e) {
                            $('#emp').empty();
                            console.log("ERROR: ", e);
                        }
                    });
                }

                function ajaxGet() {
                    $.ajax({
                        type : "GET",
                        url : "/error_msg",
                        success : function(result) {
                            $('#error').html(result);
                            console.log("MESSAGE SHOWS");
                        }
                    });
                }
            }
        )
    </script>
</head>
<body>
<nav class="navbar navbar-light bg-light">
    <a ckass="navbar-brand" href ="/admin_platform" >Main Menu</a>
    <a href="/logout"><input class="btn btn-outline-success mr-auto" type="button" name="logout" id="logout" value="Logout"></a>
</nav>
<div sec:authorize="isAuthenticated()">
    Authenticated as <span sec:authentication="name"></span>
</div>
<div id="main_container" align="center">
    <div class="stores-wrapper">
        <div class="subtitle">
            Display Drones
        </div>
        <br>
        <div id="drones">
            <form id="displayDronesForm" action="#" method="get">
                <div class="form-group">
                    <label for="storeName">Store Name:</label>
                    <input type="text" class="form-control" id="storeName" name="storeName" required/>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
            <br>
            <table id="drone-list" class="drone-list" style="max-width: 3000px" border="1">
                <thead>
                <tr>
                    <th style="max-width:600px">Drone ID</th>
                    <th style="max-width:400px">Weight Capacity</th>
                    <th style="max-width:400px">Assigned Orders</th>
                    <th style="max-width:400px">Remaining Capacity</th>
                    <th style="max-width:400px">Fuel</th>
                    <th style="max-width:400px">Flown By</th>
                </tr>
                </thead>
                <tbody id="emp">

                </tbody>
            </table>
        </div>
        <div id="error" align="center"></div>
    </div>
</div>
</body>
</html>
